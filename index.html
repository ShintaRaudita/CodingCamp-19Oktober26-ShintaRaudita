<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark-theme">
    <!-- Header -->
    <header id="header">
        <div class="header-left">
            <h1 id="greeting-container">
                Good <span id="time-of-day">night</span>, 
                <span id="user-name" contenteditable="false">Shinta</span>
                <button id="edit-name-btn" title="Edit Name">✏️</button>
            </h1>
            <div id="live-clock">Monday, 12 october 2026 | 14:24:44</div>
        </div>
        <div class="header-controls">
            <button id="theme-toggle">🌓 light/dark mode</button>
            <div class="io-buttons">
                <label class="import-label">
                    Import
                    <input type="file" id="import-btn" accept=".json">
                </label>
                <button id="export-btn">export</button>
            </div>
        </div>
    </header>

    <!-- Bento Grid Layout -->
    <main class="bento-grid">
        <!-- LEFT COLUMN: Focus Timer & Upcoming Task -->
        <div class="grid-column">
            <!-- Focus Timer Card (v1 Layout) -->
            <section id="focus-timer" class="bento-card">
                <h2>Focus Timer</h2>
                
                <div id="timer-display">25:00</div>

                <div class="timer-controls">
                    <button id="timer-start" class="btn-pink">Start</button>
                    <button id="timer-stop" class="btn-pink">Stop</button>
                    <button id="timer-reset" class="btn-pink">Reset</button>
                </div>

                <div class="timer-settings inline-settings">
                    <label>Focus (min): <input type="number" id="setting-focus" value="25" min="1"></label>
                    <label>Short Break: <input type="number" id="setting-short" value="5" min="1"></label>
                    <label>Long Break: <input type="number" id="setting-long" value="10" min="1"></label>
                </div>
            </section>

            <!-- Upcoming Task Card -->
            <section id="upcoming-tasks" class="bento-card drop-zone">
                <div class="card-header-row">
                    <h2>upcoming task</h2>
                    <span class="sort-by-text">sort by</span>
                </div>
                <span id="active-date-display" class="active-date-label">Select a date</span>
                <form id="upcoming-add-form" style="display: none;">
                    <input type="text" id="upcoming-task-input" placeholder="add new task" required>
                    <button type="submit">add task</button>
                </form>
                <ul id="upcoming-task-list" class="task-list"></ul>
            </section>
        </div>

        <!-- RIGHT COLUMN: To Do List Today & Calendar -->
        <div class="grid-column">
            <!-- To Do List Today Card -->
            <section id="today-tasks" class="bento-card drop-zone">
                <div class="card-header-row">
                    <h2>to do list today</h2>
                    <div class="sort-controls">
                        <span class="sort-by-text">sort by</span>
                        <select id="sort-tasks">
                            <option value="none">First option</option>
                            <option value="az">A-Z</option>
                            <option value="completion">Completion</option>
                        </select>
                    </div>
                </div>

                <!-- Progress Bar (Moved Here & Responsive) -->
                <div class="progress-section">
                    <div id="progress-percentage">0% task completed</div>
                    <div class="progress-container">
                        <div id="progress-bar"></div>
                    </div>
                </div>

                <form id="today-add-form">
                    <input type="text" id="today-task-input" placeholder="add new task" required>
                    <button type="submit">add task</button>
                </form>
                <ul id="today-task-list" class="task-list"></ul>
            </section>

            <!-- Calendar Card -->
            <section id="calendar-widget" class="bento-card">
                <h2>calendar</h2>
                <div id="calendar-header">
                    <button id="prev-month">&lt;</button>
                    <span id="current-month-year">october 2026</span>
                    <button id="next-month">&gt;</button>
                </div>
                <div id="calendar-grid-header">
                    <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
                </div>
                <div id="calendar-grid"></div>
            </section>
        </div>
    </main>

    <!-- FULL WIDTH BOTTOM: Quick Links -->
    <footer id="quick-links-footer">
        <section id="quick-links" class="bento-card">
            <h2>quick links</h2>
            <form id="link-add-form">
                <input type="text" id="link-label" placeholder="Label (e.g. Gmail)" required>
                <input type="url" id="link-url" placeholder="URL (e.g. https://...)" required>
                <button type="submit">add link</button>
            </form>
            <div id="links-grid"></div>
        </section>
    </footer>

    <div id="notify" aria-live="polite"></div>

    <script src="js/app.js"></script>
</body>
</html>
